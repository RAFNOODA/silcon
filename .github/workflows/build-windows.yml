name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build standalone EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SiliconFoundry main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconFoundry-Windows
          path: dist/SiliconFoundry.exe
          if-no-files-found: error
          retention-days: 30
